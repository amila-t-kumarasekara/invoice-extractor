services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: invoice
      POSTGRES_PASSWORD: invoice
      POSTGRES_DB: invoice
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoice"]
      interval: 2s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://invoice:invoice@db:5432/invoice
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage
      - .:/app

  worker:
    build: .
    command: python -m app.worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://invoice:invoice@db:5432/invoice
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage
      - .:/app

volumes:
  pgdata:
